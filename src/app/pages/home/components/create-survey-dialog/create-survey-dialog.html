<dialog
  #dialog
  class="create-survey-dialog"
  aria-labelledby="create-survey-title"
  (cancel)="handleCancel($event)"
  (close)="resetForm()"
>
  <div class="create-survey-dialog__mobile-header">
    <a
      class="create-survey-dialog__mobile-home-link"
      routerLink="/"
      aria-label="Back to Poll App home"
      (click)="close()"
    >
      <img
        class="create-survey-dialog__mobile-logo"
        src="img/pollapp_orange.png"
        alt="Poll App"
        width="119"
        height="50"
      />
    </a>
  </div>

  <div class="create-survey-dialog__frame">
    <header class="create-survey-dialog__header">
      <div>
        <span class="create-survey-dialog__status">Draft</span>
        <h2 id="create-survey-title" class="create-survey-dialog__title">Create new survey</h2>
      </div>

      <button
        class="create-survey-dialog__cancel-button"
        type="button"
        aria-label="Cancel creating the survey"
        [disabled]="isPublishing()"
        (click)="close()"
      >
        <span>Cancel</span>
        <span class="create-survey-dialog__close-icon" aria-hidden="true"></span>
      </button>
    </header>

    <app-survey-form (surveyPublished)="handleSurveyPublished($event)" />
  </div>
</dialog>

@if (publishConfirmationVisible()) {
  <aside class="create-survey-confirmation">
    <p
      class="create-survey-confirmation__message"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    >
      Your survey is now published!
    </p>
    <button
      class="create-survey-confirmation__close-button"
      type="button"
      aria-label="Close publish confirmation"
      (click)="dismissPublishConfirmation()"
    >
      <span
        class="create-survey-dialog__close-icon create-survey-confirmation__close-icon"
        aria-hidden="true"
      ></span>
    </button>
  </aside>
}
